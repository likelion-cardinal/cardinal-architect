apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: cardinal
        orgId: 1
        folder: Cardinal
        type: file
        disableDeletion: false
        # UI 에서 고친 내용은 다음 동기화 때 파일 기준으로 되돌아간다.
        # 대시보드를 바꾸려면 UI 에서 JSON 을 export 해 이 파일에 반영할 것.
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nodes
  namespace: monitoring
data:
  cardinal-nodes.json: |
    {
      "uid": "cardinal-nodes",
      "title": "Cardinal — 노드 리소스",
      "description": "역할(All/control-plane/system/application)로 토글하고 노드별·파드별로 본다. node-exporter 는 호스트 전체 기준이라 kubectl top(컨테이너 합계)과 값이 다르다.",
      "tags": [
        "cardinal",
        "nodes"
      ],
      "timezone": "Asia/Seoul",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "role",
            "label": "역할",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(up{job=\"kubernetes-nodes\"}, cardinal_io_role)",
              "refId": "role"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "node",
            "label": "노드",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(up{job=\"kubernetes-nodes\",cardinal_io_role=~\"$role\"}, kubernetes_io_hostname)",
              "refId": "node"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "클러스터 요약",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "노드 수",
          "description": "node-exporter 가 UP 인 노드 수",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(up{job=\"node-exporter\"} == 1)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "총 코어",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(count by (node,cpu) (node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",

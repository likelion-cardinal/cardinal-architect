apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/baremetal/deploy.yaml
  - daemonset.yaml

patches:
  # ALB 가 TLS 를 종료하고 노드로는 평문 HTTP 를 보낸다. 이 설정이 없으면
  # nginx 가 ALB 의 X-Forwarded-Proto: https 를 무시하고 자기가 본 http 로
  # 덮어써서, 백엔드가 자기 주소를 http:// 로 오해한다(카카오 KOE006).
  # application/configmap.yaml 의 SERVER_FORWARD_HEADERS_STRATEGY 와 한 세트다.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      data:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        proxy-real-ip-cidr: "10.20.0.0/16"

  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx

  # target 을 명시한 JSON6902 로 둔다. 인라인 strategic merge 는 ports 리스트가
  # 병합되지 않고 nodePort 가 조용히 누락되는 일이 있었다(에러도 안 난다).
  # ports 순서는 업스트림 base 기준 0=http(80), 1=https(443).
  - target:
      version: v1
      kind: Service
      name: ingress-nginx-controller
      namespace: ingress-nginx
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/externalTrafficPolicy
        value: Cluster
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443

  - target:
      kind: Job
      namespace: ingress-nginx
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          cardinal.io/role: application

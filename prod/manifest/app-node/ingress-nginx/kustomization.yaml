apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/baremetal/deploy.yaml
  - daemonset.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx

  # target 을 명시한 JSON6902 로 둔다. 인라인 strategic merge 는 ports 리스트가
  # 병합되지 않고 nodePort 가 조용히 누락되는 일이 있었다(에러도 안 난다).
  # ports 순서는 업스트림 base 기준 0=http(80), 1=https(443).
  - target:
      version: v1
      kind: Service
      name: ingress-nginx-controller
      namespace: ingress-nginx
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/externalTrafficPolicy
        value: Cluster
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/ports/1/nodePort
        value: 30443

  - target:
      kind: Job
      namespace: ingress-nginx
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          cardinal.io/role: application

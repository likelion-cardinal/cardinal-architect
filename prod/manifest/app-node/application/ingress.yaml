apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # OAuth2 인가요청(state, PKCE code_verifier)이 백엔드의 HTTP 세션에 저장되는데
    # 백엔드가 2개라 /oauth2/authorization 과 /login/oauth2/code 가 서로 다른
    # 파드로 가면 세션을 못 찾고 /login?error 로 튕긴다. staging 은 컨테이너가
    # 1개여서 안 드러났던 문제다. 같은 브라우저를 같은 파드로 고정한다.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "cardinal-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8055
          # 카카오 로그인. Spring Security 의 기본 엔드포인트라 /api 아래가 아니라
          # 루트에 있다. staging nginx 도 location /oauth2/ 와 /login/oauth2/ 를
          # 따로 백엔드로 보냈다. 빼면 프론트로 가서 로그인이 통째로 깨진다.
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8055
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8055
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

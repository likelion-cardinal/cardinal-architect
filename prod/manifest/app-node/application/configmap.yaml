apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  TZ: "Asia/Seoul"
  #Spring Boot
  SPRING_PROFILES_ACTIVE: "local"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
  
  # DB
  MYSQL_LOCAL_URL: "jdbc:mysql://mysql.database.svc.cluster.local:3306/cardinal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  MYSQL_LOCAL_USERNAME: "cardinal"
  
  # Redis
  REDIS_HOST: "redis.database.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq.database.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "cardinal"

  # 카카오는 토큰 요청에서 client_secret 을 POST 본문으로만 받는다. Spring Security
  # 는 client-secret 이 있으면 기본값이 client_secret_basic(Authorization: Basic)이라
  # 카카오가 KOE010 "Bad client credentials" 로 거부한다. 값이 틀린 게 아니라
  # 보내는 방식이 문제였다(같은 시크릿으로 POST 방식은 통과하는 걸 확인).
  # 환경변수 이름으로 주면 Spring 의 relaxed binding 이 client-authentication-method
  # 를 client.authentication.method 로 해석해 안 먹는다. SPRING_APPLICATION_JSON 은
  # 프로퍼티 이름을 그대로 받으므로 변환 논란이 없다.
  SPRING_APPLICATION_JSON: '{"spring":{"security":{"oauth2":{"client":{"registration":{"kakao":{"client-authentication-method":"client_secret_post"}}}}}}}'

  # TLS 는 ALB 에서 끝나고 노드로는 평문 HTTP 가 온다. 이 값이 없으면 Spring 이
  # {baseUrl} 을 http:// 로 조립해서 카카오에 넘기고, 콘솔에 등록한 https:// 와
  # 달라 KOE006 이 난다. ingress-nginx 의 use-forwarded-headers=true 와 한 세트다.
  SERVER_FORWARD_HEADERS_STRATEGY: "FRAMEWORK"

  # OAuth2 (카카오 로그인 성공 후 프론트로 돌려보낼 주소)
  # staging 은 https://cardinal-staging.duckdns.org/auth/callback 이었다.
  OAUTH2_REDIRECT_URI: "https://2026cardinal.com/auth/callback"

  #Admin
  ADMIN_USERNAME: "admin_cardinal"

  #R2
  R2_ENDPOINT: "https://7c4c4fe1e12f57b54b6057ed193e57f0.r2.cloudflarestorage.com"
  R2_BUCKET: "cardinal-sogang"
  R2_PUBLIC_URL: "https://pub-f657af7c06f9411db9a0f3d9063dd289.r2.dev"

  # JWT 인증 기간
  JWT_ACCESS_VALIDITY: "3600"
  JWT_REFRESH_VALIDITY: "86400"
  JWT_COOKIE_SECURE: "true"
  JWT_COOKIE_SAME_SITE: "Lax"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: default
data:
  TZ: "Asia/Seoul"
  VITE_API_URL: "/api"
  VITE_ADMIN_PATH: "manage-cdnl-qk29dls93x"
